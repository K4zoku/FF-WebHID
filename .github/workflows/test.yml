name: Test

on:
  push:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'addon/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'addon/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
      - name: Install dependencies
        run: |
            sudo apt-get update
            sudo apt-get install -y libudev-dev linux-modules-extra-$(uname -r)
            npm ci
            npx playwright install firefox --with-deps
      - name: Run unit tests
        run: npm run test:rs
      - name: Setup uhid + udev rules + webhid group
        run: |
          sudo groupadd --system webhid
          sudo usermod -aG webhid "$(whoami)"
          sudo install -Dm644 manifests/99-webhid-e2e.rules /etc/udev/rules.d/99-webhid-e2e.rules
          sudo modprobe uhid
          sudo udevadm control --reload-rules
          sudo udevadm trigger
      - name: Run E2E tests
        run: sg webhid -c "npm run test"
