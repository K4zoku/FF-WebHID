name: Test

on:
  push:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'addon/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'addon/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: crates -> target
      - name: Cache APT Packages
        uses: awalsh128/cache-apt-pkgs-action@b8f4936ae6bd604d21de6c1243d45b013396d81b
        with:
          packages: libudev-dev
          version: v1
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - name: Install npm dependencies
        run: npm ci
      - name: Build Rust binaries
        run: npm run build:rs:debug
      - name: Run unit tests
        run: npm run test:rs
      - name: Upload debug binaries
        uses: actions/upload-artifact@v7
        with:
          name: webhid-debug-binaries
          path: |
            crates/target/debug/webhid-daemon
            crates/target/debug/webhid-mock
            crates/target/debug/webhid-native-messaging

  e2e:
    name: E2E tests
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache APT Packages
        uses: awalsh128/cache-apt-pkgs-action@b8f4936ae6bd604d21de6c1243d45b013396d81b
        with:
          packages: |
              ffmpeg
              libatk1.0-0t64
              libcairo-gobject2
              libcairo2
              libdbus-1-3
              libfontconfig1
              libfreetype6
              libgdk-pixbuf-2.0-0
              libglib2.0-0t64
              libgtk-3-0t64
              libpango-1.0-0
              libpangocairo-1.0-0
              libx11-6
              libx11-xcb1
              libxcb-shm0
              libxcb1
              libxcomposite1
              libxcursor1
              libxdamage1
              libxext6
              libxfixes3
              libxi6
              libxrandr2
              libxrender1
          version: v1
      - name: Install kernel modules
        run: sudo apt-get update && sudo apt-get install -y linux-modules-extra-$(uname -r)
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - name: Install npm dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install firefox
      - name: Download debug binaries
        uses: actions/download-artifact@v8
        with:
          name: webhid-debug-binaries
          path: crates/target/debug
      - name: Make binaries executable
        run: chmod +x crates/target/debug/webhid-daemon crates/target/debug/webhid-mock crates/target/debug/webhid-native-messaging
      - name: Setup uhid + udev rules + webhid group
        run: |
          sudo groupadd --system webhid
          sudo usermod -aG webhid "$(whoami)"
          sudo install -Dm644 manifests/99-webhid-e2e.rules /etc/udev/rules.d/99-webhid-e2e.rules
          sudo modprobe uhid
          sudo udevadm control --reload-rules
          sudo udevadm trigger
      - name: Run E2E tests
        run: |
          sg webhid -c "npm run test -- --workers=1 --retries=2"
          sg webhid -c "npm run test:e2e:forwarder -- --workers=1 --retries=2"

  benchmark:
    name: Benchmark
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache APT Packages
        uses: awalsh128/cache-apt-pkgs-action@b8f4936ae6bd604d21de6c1243d45b013396d81b
        with:
          packages: |
              ffmpeg
              libatk1.0-0t64
              libcairo-gobject2
              libcairo2
              libdbus-1-3
              libfontconfig1
              libfreetype6
              libgdk-pixbuf-2.0-0
              libglib2.0-0t64
              libgtk-3-0t64
              libpango-1.0-0
              libpangocairo-1.0-0
              libx11-6
              libx11-xcb1
              libxcb-shm0
              libxcb1
              libxcomposite1
              libxcursor1
              libxdamage1
              libxext6
              libxfixes3
              libxi6
              libxrandr2
              libxrender1
          version: v1
      - name: Install kernel modules
        run: sudo apt-get update && sudo apt-get install -y linux-modules-extra-$(uname -r)
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - name: Install npm dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install firefox
      - name: Download debug binaries
        uses: actions/download-artifact@v8
        with:
          name: webhid-debug-binaries
          path: crates/target/debug
      - name: Make binaries executable
        run: chmod +x crates/target/debug/webhid-daemon crates/target/debug/webhid-mock crates/target/debug/webhid-native-messaging
      - name: Setup uhid + udev rules + webhid group
        run: |
          sudo groupadd --system webhid
          sudo usermod -aG webhid "$(whoami)"
          sudo install -Dm644 manifests/99-webhid-e2e.rules /etc/udev/rules.d/99-webhid-e2e.rules
          sudo modprobe uhid
          sudo udevadm control --reload-rules
          sudo udevadm trigger
      - name: Run benchmark
        run: sg webhid -c "npm run test:benchmark"
