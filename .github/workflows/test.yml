name: Test

on:
  push:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'addon/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'addon/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
      - name: Cache APT Packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: |
              libudev-dev
              ffmpeg
              libatk1.0-0t64
              libcairo-gobject2
              libcairo2
              libdbus-1-3
              libfontconfig1
              libfreetype6
              libgdk-pixbuf-2.0-0
              libglib2.0-0t64
              libgtk-3-0t64
              libpango-1.0-0
              libpangocairo-1.0-0
              libx11-6
              libx11-xcb1
              libxcb-shm0
              libxcb1
              libxcomposite1
              libxcursor1
              libxdamage1
              libxext6
              libxfixes3
              libxi6
              libxrandr2
              libxrender1
          version: v1
      - name: Install kernel modules
        run: sudo apt-get install -y linux-modules-extra-$(uname -r)
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:rs
      - name: Setup uhid + udev rules + webhid group
        run: |
          sudo groupadd --system webhid
          sudo usermod -aG webhid "$(whoami)"
          sudo install -Dm644 manifests/99-webhid-e2e.rules /etc/udev/rules.d/99-webhid-e2e.rules
          sudo modprobe uhid
          sudo udevadm control --reload-rules
          sudo udevadm trigger
      - name: Run E2E tests
        run: sg webhid -c "npm run test"
