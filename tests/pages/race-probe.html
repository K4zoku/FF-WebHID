<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      window.tests = window.tests || { helper: {}, results: {} }
      window.tests.results.race = { got: 'pending' }
      try {
        var w = new Worker('/worker-race.js?_=' + Date.now())
        w.onmessage = function (e) {
          window.tests.results.race = e.data
        }
        w.onerror = function () {
          window.tests.results.race = { got: 'error' }
        }
        setTimeout(function () {
          if (window.tests.results.race.got === 'pending') {
            window.tests.results.race = { got: 'timeout' }
          }
        }, 3000)
      } catch (e) {
        window.tests.results.race = { got: 'thrown', message: String(e) }
      }
    </script>
  </head>
  <body></body>
</html>
