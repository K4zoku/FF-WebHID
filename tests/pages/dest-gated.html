<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>dest-gated</title></head>
<body>
<script>
window.tests = window.tests || { helper: {}, results: {} };
window.tests.results.workerState = 'pending';
try {
  const w = new Worker(location.href);
  w.onmessage = () => { window.tests.results.workerState = 'message'; };
  w.onerror = () => { window.tests.results.workerState = 'error'; };
} catch (e) {
  window.tests.results.workerState = 'thrown';
}
</script>
</body>
</html>
