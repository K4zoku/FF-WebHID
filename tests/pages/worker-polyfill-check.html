<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Worker Polyfill Check</title></head>
<body>
<pre id="__worker-polyfill-result">waiting...</pre>
<pre id="__worker-strict-result">waiting...</pre>
<script>
(async function () {
  var ts = Date.now();

  try {
    var w1 = new Worker('/worker-polyfill.js?_=' + ts);
    var r1 = await new Promise(function (resolve, reject) {
      w1.onmessage = function (e) { resolve(e.data); };
      w1.onerror = function (e) { reject(e.message); };
      setTimeout(function () { reject('timeout'); }, 5000);
    });
    document.getElementById('__worker-polyfill-result').textContent = JSON.stringify(r1);
  } catch (e) {
    document.getElementById('__worker-polyfill-result').textContent = JSON.stringify({ error: e.message || String(e) });
  }

  try {
    var w2 = new Worker('/worker-strict.js?_=' + (ts + 1));
    var r2 = await new Promise(function (resolve, reject) {
      w2.onmessage = function (e) { resolve(e.data); };
      w2.onerror = function (e) { reject(e.message); };
      setTimeout(function () { reject('timeout'); }, 5000);
    });
    document.getElementById('__worker-strict-result').textContent = JSON.stringify(r2);
  } catch (e) {
    document.getElementById('__worker-strict-result').textContent = JSON.stringify({ error: e.message || String(e) });
  }
})();
</script>
</body></html>
