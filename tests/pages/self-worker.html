<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>self-worker</title>
  </head>
  <body>
    <script>
      window.tests = window.tests || { helper: {}, results: {} }
      window.tests.results.selfWorker = 'pending'
      try {
        const w = new Worker(location.href)
        w.onmessage = (e) => {
          window.tests.results.selfWorker = e.data
        }
        w.onerror = () => {
          window.tests.results.selfWorker = 'error'
        }
      } catch (e) {
        window.tests.results.selfWorker = 'thrown'
      }
      setTimeout(() => {
        if (window.tests.results.selfWorker === 'pending')
          window.tests.results.selfWorker = 'timeout'
      }, 3000)
    </script>
  </body>
</html>
