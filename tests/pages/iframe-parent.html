<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Iframe Parent</title></head>
<body>
<p>Cross-origin iframe WITHOUT allow="hid":</p>
<iframe id="no-allow" src="http://localhost:3081/iframe-child-no-allow"></iframe>
<p>Cross-origin iframe WITH allow="hid":</p>
<iframe id="with-allow" src="http://localhost:3081/iframe-child-with-allow" allow="hid"></iframe>
</body></html>
