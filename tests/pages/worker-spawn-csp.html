<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Worker Spawn CSP Test</title>
</head>
<body>
<div id="status">loading</div>
<script>
(async () => {
  const status = document.getElementById('status');
  try {
    const w = new Worker(location.href + '?worker=1');
    w.onmessage = (e) => {
      if (e.data && e.data.type === 'ready') {
        status.textContent = 'worker-ready';
      } else {
        status.textContent = 'worker-message:' + JSON.stringify(e.data);
      }
    };
    w.onerror = (e) => {
      status.textContent = 'worker-error:' + (e.message || 'unknown');
    };
    setTimeout(() => {
      if (status.textContent === 'loading') {
        status.textContent = 'worker-timeout';
      }
    }, 5000);
  } catch (e) {
    status.textContent = 'worker-threw:' + e.message;
  }
})();
</script>
</body>
</html>
