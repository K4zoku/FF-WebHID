<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Iframe Child</title>
  </head>
  <body>
    <script>
      (async function () {
        let isCrossOrigin = false;
        if (window !== window.top) {
          try {
            window.parent.location.origin;
          } catch {
            isCrossOrigin = true;
          }
        }

        let qHid;
        try {
          qHid = (await navigator.permissions.query({ name: "hid" })).state;
        } catch (e) {
          qHid = "ERROR: " + e.message;
        }

        const hidUndefined = typeof navigator.hid === "undefined";

        window.tests = window.tests || { helper: {}, results: {} };
        window.tests.results.perm = { isCrossOrigin, queryHid: qHid, hidUndefined };
      })();
    </script>
  </body>
</html>
