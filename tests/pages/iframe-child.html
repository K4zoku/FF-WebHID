<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Iframe Child</title>
  </head>
  <body>
    <div id="__start-marker"></div>
    <script>
      (async function () {
        const _urlAtStart = location.href;
        let isCrossOrigin = false;
        if (window !== window.top) {
          try {
            window.parent.location.origin;
          } catch {
            isCrossOrigin = true;
          }
        }

        let qHid;
        try {
          qHid = (await navigator.permissions.query({ name: "hid" })).state;
        } catch (e) {
          qHid = "ERROR: " + e.message;
        }
        console.log("DEBUG[" + _urlAtStart + "] qHid =", qHid);

        const hidUndefined = typeof navigator.hid === "undefined";
        console.log("DEBUG[" + _urlAtStart + "] hidUndefined =", hidUndefined);

        const result = { isCrossOrigin, queryHid: qHid, hidUndefined, _urlAtStart };
        const el = document.createElement("div");
        el.id = "__perm-result";
        el.dataset.json = JSON.stringify(result);
        el.textContent = JSON.stringify(result);
        document.body.appendChild(el);
        console.log("DEBUG[" + _urlAtStart + "] result element appended");
      })();
    </script>
  </body>
</html>
