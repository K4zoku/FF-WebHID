<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Worker API Check</title></head>
<body>
<pre id="__worker-result">waiting...</pre>
<script>
(async function () {
  var ts = Date.now();
  try {
    var w = new Worker('/worker.js?_=' + ts);
    var r = await new Promise(function (resolve, reject) {
      w.onmessage = function (e) { resolve(e.data); };
      w.onerror = function (e) { reject(e.message || e.error?.message || String(e)); };
      setTimeout(function () { reject('timeout'); }, 10000);
    });
    document.getElementById('__worker-result').textContent = JSON.stringify(r);
  } catch (e) {
    document.getElementById('__worker-result').textContent = JSON.stringify({ error: e.message || String(e) });
  }
})();
</script>
</body></html>
