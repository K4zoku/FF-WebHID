<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Policy Check</title></head>
<body>
<script>
(async function() {
  let isCrossOrigin = false;
  if (window !== window.top) {
    try { window.parent.location.origin; }
    catch { isCrossOrigin = true; }
  }

  let qHid, qCamera;
  try { qHid = (await navigator.permissions.query({ name: 'hid' })).state; }
  catch (e) { qHid = 'ERROR: ' + e.message; }
  try { qCamera = (await navigator.permissions.query({ name: 'camera' })).state; }
  catch (e) { qCamera = 'ERROR: ' + e.message; }

  // Try getDevices — will throw SecurityError if policy blocks
  let getDevicesResult;
  try {
    const devices = await navigator.hid.getDevices();
    getDevicesResult = { ok: true, count: devices.length };
  } catch (e) {
    getDevicesResult = { ok: false, name: e.name, message: e.message };
  }

  const result = {
    isTop: window === window.top,
    isCrossOrigin,
    queryHid: qHid,
    queryCamera: qCamera,
    getDevices: getDevicesResult,
  };

  const el = document.createElement('div');
  el.id = '__perm-result';
  el.dataset.json = JSON.stringify(result);
  document.body.appendChild(el);
})();
</script>
</body></html>
