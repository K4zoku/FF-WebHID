<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Same-Origin Policy Check</title>
  </head>
  <body>
    <script>
      window.addEventListener('load', async () => {
        let queryHid
        try {
          queryHid = (await navigator.permissions.query({ name: 'hid' })).state
        } catch (e) {
          queryHid = 'ERROR: ' + e.message
        }
        const hidUndefined = typeof navigator.hid === 'undefined'
        let getDevicesResult
        try {
          const devices = await navigator.hid.getDevices()
          getDevicesResult = { ok: true, count: devices.length }
        } catch (e) {
          getDevicesResult = { ok: false, name: e.name, message: e.message }
        }
        window.tests = window.tests || { helper: {}, results: {} }
        window.tests.results.perm = {
          isTop: window === window.top,
          isCrossOrigin: false,
          queryHid,
          getDevices: getDevicesResult,
          hidUndefined
        }
      })
    </script>
  </body>
</html>
