<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WebHID E2E Test</title>
  </head>
  <body>
    <button id="request-device-btn" style="display: none">Request Device</button>
    <script>
      ;(function () {
        'use strict'
        window.tests = window.tests || { helper: {}, results: {} }

        // navigator.hid.requestDevice requires transient user activation, and the
        // polyfill enforces it exactly like native WebHID (SecurityError otherwise).
        // page.evaluate has no user gesture, so tests go through this shim: a
        // synthetic click() counts as user interaction per the HTML spec, which lets
        // the picker open while Playwright drives it with the keyboard. Resolves
        // with the number of granted devices (HIDDevice objects are not
        // serializable, so the count is all the test can observe here; device
        // details come from navigator.hid.getDevices() in later evaluates).
        window.tests.helper.requestDevice = (filters) =>
          new Promise((resolve, reject) => {
            const btn = document.getElementById('request-device-btn')
            btn.onclick = async () => {
              try {
                const devices = await navigator.hid.requestDevice({ filters: filters || [] })
                resolve(devices.length)
              } catch (e) {
                reject(e)
              }
            }
            btn.click()
          })
      })()
    </script>
  </body>
</html>
