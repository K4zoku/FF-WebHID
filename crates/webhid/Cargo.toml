[package]
name = "webhid"
version = "3.1.0"
edition = "2024"
license = "MIT"

[dependencies]
base64 = "0.22"
bytes = "1.11.1"
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util"] }

[features]
hardening = ["dep:libc"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
