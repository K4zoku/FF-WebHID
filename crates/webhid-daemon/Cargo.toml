[package]
name = "webhid-daemon"
version = "2.2.0"
edition = "2024"
license = "MIT"

[features]
default = ["report-blocking"]
hardening = ["webhid/hardening"]
# Enforce report-level blocking for Generic Desktop consumer-input collections
# (mouse 0x0002, keyboard 0x0006, keypad 0x0007, system control 0x0080):
# input reports are dropped at the reader, output/feature writes are rejected.
# On by default to match Chromium/WICG behavior; build with
# `--no-default-features` to keep consumer-input devices (e.g. macropads)
# fully usable.
report-blocking = []

[dependencies]
webhid = { path = "../webhid" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "io-util", "io-std", "time", "signal", "macros"] }
anyhow = { version = "1", default-features = false, features = ["std"] }
log = { version = "0.4", features = ["std"] }
tokio-tungstenite = "0.26"
wtransport = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
getrandom = "0.4"
subtle = "2"
sha2 = "0.10"
hex = "0.4"
bytes = "1"
hidapi = { version = "2.6", default-features = false }
hidreport = { version = "0.6", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
udev = "0.8"
libc = "0.2"
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device"] }
core-foundation-sys = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
