# mdev configuration for WebHID daemon hidraw access.
#
# Alpine Linux uses BusyBox mdev by default (not udev). This file configures
# device permissions at /etc/mdev.conf.
#
# The WebHID daemon runs as root via systemd, so it has direct access to all
# hidraw devices. This rule ensures the device nodes are owned by root:webhid
# so that users in the 'webhid' group can interact with the daemon's Unix socket.
#
# For non-root daemon mode, users must add their user to the 'webhid' group:
#   sudo addgroup $USER webhid
#
# Alternative: install eudev for full udev compatibility:
#   sudo apk add eudev
#   sudo setup-devd udev
#   sudo rc-update add udev sysinit
#   sudo rc-update add udev-trigger sysinit
# Then the standard 72-webhid.rules (udev format) will work.

hidraw[0-9]* root:webhid 0660
